services:
  qas-media-assistant:
    image: ghcr.io/418870684/qas-media-assistant:latest
    container_name: qas-media-assistant
    ports:
      - "${PUBLISH_HOST:-0.0.0.0}:${PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      PORT: 8787
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
